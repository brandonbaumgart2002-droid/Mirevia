<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Baloo 2';src:url(baloo2.ttf);font-weight:400 800}
@font-face{font-family:'Nunito Sans';src:url(nunito.ttf);font-weight:200 1000}
html,body{margin:0;background:transparent}
#b{width:1200px;padding:28px 0 26px;display:flex;flex-direction:column;align-items:center;gap:22px}
.wm{font:700 104px/1 Helvetica,Arial,sans-serif;letter-spacing:-2.4px;color:#1e2d4f}
.row{display:flex;gap:16px}

.ic{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#3b7560}
.ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rate{display:flex;align-items:center;gap:12px;font:700 30px/1 'Nunito Sans',sans-serif;color:#1e2d4f}
.rate .s{display:flex;gap:4px}
</style></head><body><div id="b">
<div class="wm">Mirevia</div>

 <div class="chip"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>30-day money-back</div>
 <div class="chip"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/><path d="M12 14.5v2.5"/></svg></span>Secure checkout</div>
 <div class="chip"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 6.5h11v9H3z"/><path d="M14 9.5h4l3 3.5v2.5h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg></span>Free shipping</div>
</div></div></body></html>
